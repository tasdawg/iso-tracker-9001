services:
  iso-tracker:
    build: .
    image: iso-tracker:latest
    container_name: iso-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Bind mounts for direct host access (persistent edits on drive)
      - ./prisma:/app/prisma
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - GIT_REPO=https://github.com/tasdawg/iso-tracker-9001.git
      - GIT_BRANCH=main
      # GitHub token for private repo access (create at github.com/settings/tokens)
      - GITHUB_TOKEN=YOUR_GITHUB_TOKEN_HERE
      # Prisma database URL pointing at bind mount
      - PRISMA_DATABASE_URL=file:/app/prisma/dev.db?connection_limit=1&timeout=30000&journal_mode=WAL
    networks:
      - iso-tracker_app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/data"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  iso-tracker_app:
    name: iso-tracker_app
    driver: bridge
