services:
  iso-tracker:
    build: .
    image: iso-tracker:latest
    container_name: iso-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/prisma
      - uploads-data:/app/uploads
    environment:
      - NODE_ENV=production
      # GitHub repo to track for updates (CHANGE THIS to your actual repo URL)
      - GIT_REPO=https://github.com/YOUR_USERNAME/iso-tracker.git
      - GIT_BRANCH=main
      # Prisma database URL pointing at the volume mount
      - PRISMA_DATABASE_URL=file:/app/prisma/dev.db?connection_limit=1&timeout=30000&journal_mode=WAL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/data"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  db-data:
    name: iso-tracker-db-data
  uploads-data:
    name: iso-tracker-uploads-data
